<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Agraja!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #1B1035;
    --night-deep: #120a24;
    --pink: #FF6FA5;
    --gold: #FFD166;
    --mint: #6FEDD6;
    --cream: #FFF8F0;
    --violet: #7C5CFF;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% -10%, #2b1a52 0%, var(--night) 45%, var(--night-deep) 100%);
    font-family:'Poppins', sans-serif;
    color: var(--cream);
    overflow-x:hidden;
  }

  .sky{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }

  .star{
    position:absolute; width:3px; height:3px; background: var(--cream);
    border-radius:50%; opacity:.6; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.9; } }

  .balloon{
    position:absolute; bottom:-220px; width:56px; height:72px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: float linear infinite; opacity:.9;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.25));
  }
  .balloon::after{
    content:""; position:absolute; bottom:-70px; left:50%; width:1px; height:70px;
    background: rgba(255,248,240,.35); transform: translateX(-50%);
  }
  @keyframes float{
    0%{ transform: translateY(0) translateX(0) rotate(-4deg); }
    50%{ transform: translateY(-55vh) translateX(20px) rotate(4deg); }
    100%{ transform: translateY(-115vh) translateX(-10px) rotate(-4deg); }
  }

  .heart{
    position:absolute; bottom:-40px; font-size: 18px; opacity:.85;
    animation: rise-heart linear infinite;
    color: var(--pink);
  }
  @keyframes rise-heart{
    0%{ transform: translateY(0) translateX(0) scale(.8) rotate(0deg); opacity:.9; }
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) scale(1.1) rotate(20deg); opacity:0; }
  }

  main{
    position:relative; z-index:1; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 18px;
  }

  /* ---------- Countdown screen ---------- */
  #countdown-screen{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 50%, #2b1a52 0%, var(--night-deep) 100%);
    transition: opacity .6s ease, visibility .6s ease;
  }
  #countdown-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  #count-number{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(6rem, 30vw, 12rem);
    background: linear-gradient(100deg, var(--gold), var(--pink) 55%, var(--mint));
    -webkit-background-clip: text; background-clip:text; color:transparent;
    animation: pop .9s ease;
  }
  @keyframes pop{
    0%{ transform: scale(.4); opacity:0; }
    40%{ transform: scale(1.15); opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }
  #count-label{
    position:absolute;
    bottom:18%;
    font-size: .95rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color: rgba(255,248,240,.55);
  }

  /* ---------- Main card ---------- */
  #main-content{ display:none; width:100%; }
  #main-content.show{ display:flex; align-items:center; justify-content:center; }

  .card{
    max-width: 600px; width:100%;
    text-align:center;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 46px 30px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    opacity:0;
    animation: cardrise .8s ease forwards;
  }
  @keyframes cardrise{
    from{ opacity:0; transform: translateY(24px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .eyebrow{
    font-size: 13px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--mint); margin-bottom: 14px;
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 4rem);
    line-height: 1.05;
    margin: 0 0 6px;
    background: linear-gradient(100deg, var(--gold), var(--pink) 45%, var(--mint), var(--violet));
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradientmove 6s ease infinite;
    text-shadow: 0 0 30px rgba(255,209,102,.25);
  }
  @keyframes gradientmove{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  .name-line{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--cream);
    margin: 0 0 18px;
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ text-shadow: 0 0 12px rgba(255,209,102,.35), 0 0 2px rgba(255,255,255,.4); }
    50%{ text-shadow: 0 0 26px rgba(255,111,165,.55), 0 0 6px rgba(255,255,255,.6); }
  }

  .sub{
    font-size: 1.02rem;
    color: rgba(255,248,240,.82);
    max-width: 460px;
    margin: 0 auto 30px;
    line-height:1.6;
  }

  /* video */
  .video-wrap{
    position:relative;
    width:100%;
    max-width: 460px;
    margin: 0 auto 30px;
    border-radius: 20px;
    overflow:hidden;
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .video-wrap video{
    width:100%;
    display:block;
    aspect-ratio: 16/9;
    background:#000;
  }

  /* photo */
  .photo-wrap{
    width: 140px; height: 140px;
    margin: 0 auto 22px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(255,209,102,.15), 0 10px 30px rgba(0,0,0,.35);
  }
  .photo-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }

  /* cake */
  .cake{ position:relative; width: 190px; margin: 0 auto 26px; }
  .plate{
    width:210px; height:14px; margin-left:-10px;
    background: linear-gradient(180deg, #3a2a63, #241448);
    border-radius:50%;
    box-shadow: 0 12px 24px rgba(0,0,0,.4);
  }
  .tier{
    width:162px; height:52px; margin: -4px auto 0;
    background: linear-gradient(180deg, var(--pink), #e8548f);
    border-radius: 8px; position:relative;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.08);
  }
  .tier.top{ width:114px; height:44px; background: linear-gradient(180deg, var(--gold), #f0b429); }
  .tier::before{
    content:""; position:absolute; top:-6px; left:0; right:0; height:14px;
    background: var(--cream); border-radius: 50%;
  }
  .candle{
    position:absolute; top:-42px; width:6px; height:32px;
    background: repeating-linear-gradient(180deg, var(--mint) 0 6px, var(--cream) 6px 12px);
    border-radius: 2px;
  }
  .candle:nth-child(1){ left: 18px; }
  .candle:nth-child(2){ left: 50px; }
  .candle:nth-child(3){ left: 82px; }
  .flame{
    position:absolute; top:-13px; left:50%; transform: translateX(-50%);
    width:9px; height:13px;
    background: radial-gradient(circle at 50% 70%, #fff2b0, var(--gold) 60%, #ff8a3d 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%{ transform: translateX(-50%) scale(1.08) rotate(3deg); }
  }

  .celebrate-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--night-deep);
    background: linear-gradient(100deg, var(--gold), var(--pink));
    border: none;
    padding: 14px 34px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(255,111,165,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .celebrate-btn:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 36px rgba(255,111,165,.5); }
  .celebrate-btn:active{ transform: translateY(0) scale(.98); }

  .confetti-piece{
    position:fixed; top:-10px; z-index:20; pointer-events:none; border-radius:2px;
  }

  @media (max-width: 480px){
    .card{ padding: 34px 18px 30px; border-radius: 22px; }
    .cake{ transform: scale(.9); }
  }

  @media (prefers-reduced-motion: reduce){
    .balloon, .heart, .star, .flame, h1, .name-line, #count-number{
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<!-- Countdown -->
<div id="countdown-screen">
  <div id="count-number">3</div>
  <div id="count-label">get ready, Agraja...</div>
</div>

<main id="main-content">
  <div class="card">
    <div class="eyebrow">A little something for you</div>
    <h1>Happy Birthday</h1>
    <div class="name-line">Agraja! 🎂</div>

    <!-- Photo: replace src below with a photo of Agraja -->
    <div class="photo-wrap">
      <img src="https://placehold.co/300x300/2b1a52/FFD166?text=Agraja" alt="Agraja">
    </div>

    <p class="sub">Wishing you a day as wonderful as you are &mdash; and a year ahead full of good stories, good food, and even better memories.</p>

    <!-- Video: replace src below with your own video file -->
    <div class="video-wrap">
      <video controls autoplay muted loop playsinline poster="https://placehold.co/800x450/1B1035/FFD166?text=Happy+Birthday+Agraja">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="cake">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="tier top"></div>
      <div class="tier"></div>
      <div class="plate"></div>
    </div>

    <button class="celebrate-btn" id="celebrateBtn">🎊 Celebrate!</button>
  </div>
</main>

<script>
  // stars
  const sky = document.getElementById('sky');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*60 + 'vh';
    s.style.animationDelay = (Math.random()*3) + 's';
    sky.appendChild(s);
  }

  // balloons
  const balloonColors = ['#FF6FA5','#FFD166','#6FEDD6','#7C5CFF'];
  for(let i=0;i<8;i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = (Math.random()*90) + 'vw';
    b.style.background = balloonColors[i % balloonColors.length];
    b.style.animationDuration = (14 + Math.random()*10) + 's';
    b.style.animationDelay = (Math.random()*10) + 's';
    sky.appendChild(b);
  }

  // floating hearts
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '❤';
    h.style.left = Math.random()*100 + 'vw';
    h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    h.style.animationDuration = (7 + Math.random()*6) + 's';
    h.style.fontSize = (14 + Math.random()*14) + 'px';
    sky.appendChild(h);
    setTimeout(()=>h.remove(), 14000);
  }
  setInterval(spawnHeart, 700);
  for(let i=0;i<6;i++) setTimeout(spawnHeart, i*300);

  // countdown 3-2-1 -> reveal
  const countScreen = document.getElementById('countdown-screen');
  const countNumber = document.getElementById('count-number');
  const countLabel = document.getElementById('count-label');
  const mainContent = document.getElementById('main-content');

  const sequence = ['3','2','1','🎉'];
  let idx = 0;

  function tick(){
    countNumber.textContent = sequence[idx];
    countNumber.style.animation = 'none';
    void countNumber.offsetWidth; // restart animation
    countNumber.style.animation = 'pop .9s ease';
    if(sequence[idx] === '🎉'){
      countLabel.textContent = 'happy birthday!';
    }
    idx++;
    if(idx < sequence.length){
      setTimeout(tick, 900);
    } else {
      setTimeout(()=>{
        countScreen.classList.add('hide');
        mainContent.classList.add('show');
        burstConfetti(window.innerWidth/2, 40, 90);
      }, 900);
    }
  }
  setTimeout(tick, 400);

  // confetti
  function burstConfetti(originX, originY, count){
    const colors = ['#FF6FA5','#FFD166','#6FEDD6','#7C5CFF','#FFF8F0'];
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const size = 6 + Math.random()*6;
      p.style.width = size + 'px';
      p.style.height = (size*0.4) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = originX + (Math.random()*160 - 80) + 'px';
      p.style.top = originY + 'px';

      const dx = (Math.random()*320 - 160);
      const dy = (Math.random()*-260 - 120);
      const rot = Math.random()*720 - 360;
      const dur = 1.2 + Math.random()*0.9;

      p.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${dx*1.3}px, ${dy*-1 + 420}px) rotate(${rot*1.4}deg)`, opacity: 0 }
      ], { duration: dur*1000, easing:'cubic-bezier(.2,.7,.3,1)' });

      document.body.appendChild(p);
      setTimeout(()=>p.remove(), dur*1000 + 50);
    }
  }

  document.getElementById('celebrateBtn').addEventListener('click', (e) => {
    const rect = e.target.getBoundingClientRect();
    burstConfetti(rect.left + rect.width/2, rect.top, 140);
  });
</script>

</body>
</html>
